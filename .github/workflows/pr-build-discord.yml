name: PR Build & Discord Notify

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release

      # ---- Discord Notification (Success) ----
      - name: Discord Notification (Success)
        if: success()
        run: |
          repo="${{ github.event.repository.html_url }}"
          pr_number="${{ github.event.pull_request.number }}"
          actor="${{ github.actor }}"

          payload=$(jq -n \
            --arg msg "✅ **Build Success** on PR #$pr_number by **$actor**" \
            --arg repo "$repo" \
            --arg pr_url "$repo/pull/$pr_number" \
            '{content: ($msg + "\n🔗 Repo: " + $repo + "\n🔗 PR: " + $pr_url)}'
          )

          curl -X POST -H "Content-Type: application/json" \
               -d "$payload" \
               "${{ secrets.DISCORD_WEBHOOK }}"

      # ---- Discord Notification (Failure) ----
      - name: Discord Notification (Failure)
        if: failure()
        run: |
          repo="${{ github.event.repository.html_url }}"
          pr_number="${{ github.event.pull_request.number }}"
          actor="${{ github.actor }}"

          payload=$(jq -n \
            --arg msg "❌ **Build Failed** on PR #$pr_number by **$actor**" \
            --arg repo "$repo" \
            --arg pr_url "$repo/pull/$pr_number" \
            '{content: ($msg + "\n🔗 Repo: " + $repo + "\n🔗 PR: " + $pr_url)}'
          )

          curl -X POST -H "Content-Type: application/json" \
               -d "$payload" \
               "${{ secrets.DISCORD_WEBHOOK }}"
